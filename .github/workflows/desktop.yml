name: Windows desktop
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer as a versioned GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the shared CLI
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run check:architecture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location desktop
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check desktop
        run: |
          bun run --cwd desktop typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bundle runtimes and installer
        run: |
          ./desktop/scripts/prepare-runtime.ps1
          bun run desktop:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run --cwd desktop dist:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and exercise the shipped application
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/WhyJ-Quant-Setup-$version-win-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'WhyJ Quant installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:WHYJ_SMOKE_EXE = Join-Path $installDir 'WhyJ Quant.exe'
          if (-not (Test-Path $env:WHYJ_SMOKE_EXE)) { throw 'Installed executable missing' }
          bun run --cwd desktop test:smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: output/playwright/desktop
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [checks, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          cp desktop/RELEASE-NOTES.md release/notes.md
          printf '\n验证记录：[Windows 构建与安装验收](%s/%s/actions/runs/%s)。\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/notes.md
          gh release create "v$version" release/*.exe release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "WhyJ Quant Desktop $version" --notes-file release/notes.md --latest
