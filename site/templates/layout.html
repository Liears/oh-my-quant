<!doctype html>
<html lang="{{locale.lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="description" content="{{page.description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:description" content="{{page.description}}" />
    <meta property="og:url" content="{{page.canonical}}" />
    <title>{{page.title}}</title>
    <link rel="canonical" href="{{page.canonical}}" />
    <link rel="alternate" hreflang="zh-CN" href="{{route.zh}}" />
    <link rel="alternate" hreflang="en" href="{{route.en}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/geist-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <svg
      class="svg-sprite"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="icon-external" viewBox="0 0 24 24">
        <path d="M6 18 18 6M6 6h12v12" />
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M15 4H5a1 1 0 0 0-1 1v10" />
      </symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24">
        <path d="m5 6 6 6-6 6m9 0h6" />
      </symbol>
      <symbol id="icon-github" viewBox="0 0 24 24">
        <path
          d="M9 20c-4 1-4-2-6-2m12 4v-4a3.5 3.5 0 0 0-1-3c3-.3 6-1.5 6-6a5 5 0 0 0-1-3 5 5 0 0 0-.1-3s-1-.3-3.3 1a11 11 0 0 0-6 0C7.3 2.7 6.3 3 6.3 3A5 5 0 0 0 6.2 6a5 5 0 0 0-1.2 3c0 4.5 3 5.7 6 6a3.5 3.5 0 0 0-1 3v4"
        />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" />
        <circle cx="15" cy="17" r="3" />
      </symbol>
    </svg>
{{partial.header}}
{{partial.content}}
    <footer class="site-footer container">
      <div class="footer-top">
        <a class="brand" href="{{route.home}}"
          ><span class="brand-mark" aria-hidden="true">Q<span>_</span></span
          ><span>WhyJ Quant</span></a
        ><span>Research. Backtest. Analyze.</span>
        <div>
          <a
            href="https://github.com/yangjingo/oh-my-quant"
            target="_blank"
            rel="noopener"
            >GitHub ↗</a
          ><a
            href="https://www.npmjs.com/package/whyj-quant"
            target="_blank"
            rel="noopener"
            >npm ↗</a
          >
        </div>
      </div>
      <div class="footer-bottom">
        <span>oh-my-quant · Built for thoughtful research.</span
        ><span>{{footer.notice}}</span>
      </div>
    </footer>
  </body>
</html>
